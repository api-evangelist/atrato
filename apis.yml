aid: atrato
name: Atrato
description: >-
  Atrato (Atrato Technologies S.A.P.I. de C.V., atratopago.com) is a Mexican fintech offering
  buy-now-pay-later (BNPL) point-of-sale financing. Affiliated merchants let shoppers split
  purchases of up to $200,000 MXN into installments of up to 24 months, without a credit or debit
  card, with approval in minutes. Atrato serves furniture, healthcare, mobility, construction,
  motorcycle, appliance and other verticals, and is regulated by PROFECO. Its Atrato Partners
  platform exposes a REST integration API (api-partners) covering in-store cash-in payment
  collection and ecommerce checkout order generation, plus status/disbursement webhooks and
  WooCommerce, Shopify and Magento plugins. This profile was enriched from Atrato's public
  developer documentation at docs.atratopago.com.

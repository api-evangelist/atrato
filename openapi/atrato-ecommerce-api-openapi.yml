        schema:
          type: string
        required: true
      - name: x-auth-token
        in: header
        description: Token de autenticación
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - reason
              properties:
                name:
                  type: string
                  description: Nombre de usuario quien solicita
                reason:
                  type: string
                  description: Motivo de cancelación
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"message\": \"Solicitud de cancelación enviada\"\n}"
